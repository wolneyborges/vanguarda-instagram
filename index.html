<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f3ec">
<title>Vanguarda — Instagram</title>
<meta name="description" content="Três propostas de Instagram para a Vanguarda Tecidos, Malhas & Estamparia Digital.">
<link rel="icon" href="midia/logo/0013_Logo-marca.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* Intro no estilo da entrada do Studio Rapport (cortina de estampas + logo montada peça por peça).
   Faixas: midia/abertura/1…9.webp (600×1800; barrados em 1, 3, 5). Logo: midia/logo/*.webp (peças do PSD do dono). */
:root {
  --fundo: #f7f3ec; --tinta: #161412; --cinza: #6d6863; --ouro: #b98426; --ouro-claro: #e8c46a;
  --arco: linear-gradient(90deg, #ff2fb3, #8a3cff, #1f6bff, #10c8e8, #2fdc6a, #ffe23a, #ff8a1f);
  --fluido: cubic-bezier(.22,1,.36,1); --cortina: cubic-bezier(.76,0,.24,1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { background: var(--fundo); color: var(--tinta); font-family: Jost, "Helvetica Neue", Arial, sans-serif; font-weight: 300; overflow: hidden; -webkit-tap-highlight-color: transparent; }

/* brilho colorido do V, girando devagar atrás de tudo */
/* sem filter: blur (travava a pintura) — manchas suaves feitas só com degradê radial */
.aura { position: fixed; inset: 0; z-index: 0; opacity: 0; pointer-events: none;
  background: radial-gradient(40vmax 30vmax at 18% 30%, #ff2fb31f, transparent 70%), radial-gradient(40vmax 30vmax at 82% 28%, #ffb21f22, transparent 70%),
              radial-gradient(45vmax 35vmax at 30% 80%, #10c8e81c, transparent 70%), radial-gradient(45vmax 35vmax at 78% 78%, #8a3cff1c, transparent 70%);
  animation: aura-on 2s ease var(--t0) forwards; }
@keyframes aura-on { to { opacity: 1; } }

/* ── cortina de estampas: descem e sobem alternadas, costura dourada, reflexo ── */
.cortina { position: fixed; inset: 0; z-index: 5; display: flex; pointer-events: none; }
.fx { flex: 1; position: relative; overflow: hidden; transform: translateY(var(--de)); border-left: 1px solid var(--ouro); }
.fx:first-child { border-left: 0; }
.fx i { position: absolute; inset: -12% 0; background: center / cover; }
.abre .fx { animation: faixa 3.4s linear forwards; animation-delay: var(--a); }
.abre .fx i { animation: pan 3.4s ease-in-out forwards; animation-delay: var(--a); }
.abre .fx::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent, rgba(232,196,106,.55) 50%, transparent) 0 -120% / 100% 60% no-repeat; animation: reflexo 3.4s ease-in-out forwards; animation-delay: var(--a); }
@keyframes faixa { 0% { transform: translateY(var(--de)); animation-timing-function: var(--cortina); } 28% { transform: none; animation-timing-function: linear; }
  72% { transform: none; animation-timing-function: var(--cortina); } 100% { transform: translateY(var(--para)); } }
@keyframes pan { from { transform: translateY(calc(var(--s) * 8%)) scale(1.08); } to { transform: translateY(calc(var(--s) * -8%)) scale(1); } }
@keyframes reflexo { 0%, 30% { background-position: 0 -120%; } 65%, 100% { background-position: 0 260%; } }
.cobre .fx { animation: cobre .6s var(--cortina) forwards; animation-delay: var(--k); }
@keyframes cobre { from { transform: translateY(var(--de)); } to { transform: none; } }
@media (max-width: 700px) { .fx:nth-child(n+6) { display: none; } .fx { --a: var(--a5) !important; } }

/* ── miolo ── */
.miolo { position: relative; z-index: 2; height: 100%; display: grid; place-content: center; justify-items: center; text-align: center; gap: 18px; padding: 24px 16px calc(24px + env(safe-area-inset-bottom, 0px)); }

/* logo montada: cada peça na posição do PSD (tela 23295 × 7170) */
.logo { position: relative; width: min(760px, 88vw); aspect-ratio: 3.249; }
.logo .p { position: absolute; }
.logo .p img { display: block; width: 100%; height: 100%; }
.logo .v { transform-origin: 50% 80%; opacity: 0; transform: scale(.35) rotate(-28deg);
  animation: v-entra 1.1s var(--fluido) var(--t0) forwards; filter: drop-shadow(0 14px 24px rgba(138,60,255,.22)); }
@keyframes v-entra { 55% { opacity: 1; transform: scale(1.08) rotate(4deg); } to { opacity: 1; transform: none; } }
.logo .v img { animation: v-ondula 5s ease-in-out calc(var(--t0) + 1.2s) infinite; transform-origin: 50% 100%; }
@keyframes v-ondula { 50% { transform: skewX(-2deg) scaleY(1.02); } }
.logo .letra { overflow: hidden; }
.logo .letra img { transform: translateY(115%); animation: sobe .8s var(--fluido) forwards; animation-delay: calc(var(--t0) + .55s + var(--i) * .07s); }
@keyframes sobe { to { transform: none; } }
.logo .pal { clip-path: inset(0 100% 0 0); animation: risca-pal .7s var(--fluido) forwards; animation-delay: calc(var(--t0) + 1.25s + var(--i) * .12s); }
@keyframes risca-pal { to { clip-path: inset(0 0 0 0); } }

.linha { width: 0; height: 2px; border-radius: 2px; background: var(--arco); animation: risca .9s var(--fluido) calc(var(--t0) + 1.9s) forwards; }
@keyframes risca { to { width: min(220px, 50vw); } }
.selo { display: inline-flex; align-items: center; gap: 10px; font-weight: 500; font-size: clamp(10px, 2.8vw, 12px); letter-spacing: .32em; text-transform: uppercase;
  background: linear-gradient(100deg, var(--ouro) 0 40%, var(--ouro-claro) 50%, var(--ouro) 60% 100%) 0 0 / 250% 100%; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  opacity: 0; animation: aparece .6s var(--fluido) calc(var(--t0) + 2.05s) forwards, brilho 4.5s ease-in-out calc(var(--t0) + 2.7s) infinite; }
.selo::before, .selo::after { content: "◆"; font-size: .8em; -webkit-text-fill-color: var(--ouro); }
@keyframes brilho { 0%, 55% { background-position: 100% 0; } 100% { background-position: -50% 0; } }
@keyframes aparece { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

/* ── 3 opções ── */
.opcoes { display: grid; gap: 10px; width: min(340px, 86vw); margin-top: 6px; }
.op { position: relative; display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 14px; padding: 10px 16px 10px 10px; text-align: left;
  background: #fffdf9; border: 1px solid var(--tinta); color: var(--tinta); text-decoration: none; cursor: pointer; font: inherit;
  opacity: 0; animation: aparece .6s var(--fluido) forwards; animation-delay: calc(var(--t0) + 2.25s + var(--i) * .1s);
  transition: transform .3s var(--fluido), background .3s, color .3s, box-shadow .3s; }
.op::before { content: ""; position: absolute; inset: -1px; background: var(--arco); z-index: -1; opacity: 0; transition: opacity .3s; }
.op:hover { transform: translateY(-3px); box-shadow: 0 14px 30px rgba(22,20,18,.14); }
.op:active { transform: scale(.98); }
.op .mini { width: 64px; height: 64px; border-radius: 50%; padding: 2px; background: var(--arco); }
.op .mini span { display: block; width: 100%; height: 100%; border-radius: 50%; border: 2px solid #fffdf9; background: center / cover; }
.op small { display: block; font-size: 10px; letter-spacing: .26em; text-transform: uppercase; color: var(--cinza); }
.op b { display: block; font-weight: 500; font-size: 17px; letter-spacing: .06em; text-transform: uppercase; margin-top: 2px; }
.op .seta { font-size: 20px; transition: transform .3s var(--fluido); }
.op:hover .seta { transform: translateX(4px); }
.op.breve { border-color: #cfc8bf; }
.op.breve b { color: #8d867f; }
.rodape { position: fixed; left: 0; right: 0; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 2; text-align: center; font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: #a59e96;
  opacity: 0; animation: aparece .6s var(--fluido) calc(var(--t0) + 2.8s) forwards; }
.aviso { position: fixed; left: 50%; bottom: calc(40px + env(safe-area-inset-bottom, 0px)); z-index: 9; transform: translate(-50%, 220%); background: var(--tinta); color: #fff; padding: 13px 20px; font-size: 13px; letter-spacing: .04em; max-width: calc(100% - 32px); text-align: center; transition: transform .45s var(--fluido), visibility 0s .45s; visibility: hidden; }
.aviso.on { transform: translate(-50%, 0); visibility: visible; transition: transform .45s var(--fluido); }

@media (min-width: 900px) {
  .miolo { gap: 22px; }
  .opcoes { grid-template-columns: repeat(3, 230px); width: auto; gap: 14px; margin-top: 14px; }
  .op { grid-template-columns: 1fr; justify-items: center; text-align: center; padding: 22px 16px 18px; gap: 10px; }
  .op .mini { width: 92px; height: 92px; }
  .op .seta { display: none; }
}
@media (max-width: 899px) {
  .miolo { gap: 14px; place-content: center; padding-bottom: calc(44px + env(safe-area-inset-bottom, 0px)); }
  .op { grid-template-columns: 50px 1fr auto; padding: 7px 14px 7px 7px; gap: 12px; }
  .op .mini { width: 50px; height: 50px; }
  .op b { font-size: 15px; }
}
@media (max-height: 640px) and (max-width: 899px) { .op .mini { width: 40px; height: 40px; } .op { grid-template-columns: 40px 1fr auto; padding: 5px 12px 5px 5px; } .miolo { gap: 10px; } .rodape { display: none; } }

/* intro já vista nesta sessão: tudo aparece rápido, sem cortina */
.rapida { --t0: 0s !important; }
.rapida .cortina { display: none; }
.rapida .logo *, .rapida .op, .rapida .linha, .rapida .rodape { animation-duration: .5s !important; }
@media (prefers-reduced-motion: reduce) { .cortina { display: none; } * { animation-duration: .01s !important; animation-delay: 0s !important; } }
</style>
</head>
<body style="--t0: 3s">
<div class="aura" aria-hidden="true"></div>
<div class="cortina abre" aria-hidden="true"></div>

<main class="miolo">
  <h1 class="logo" aria-label="Vanguarda — Tecidos, Malhas & Estamparia Digital"></h1>
  <span class="linha" aria-hidden="true"></span>
  <span class="selo">Instagram · 3 propostas</span>
  <nav class="opcoes" aria-label="Opções de Instagram"></nav>
</main>
<div class="rodape">Escolha uma opção para ver o perfil</div>
<div class="aviso" role="status"></div>

<script>
(() => {
  // ── opções (trocar "pronta" para true quando a opção existir) ──
  const OPCOES = [
    { n: 1, nome: "Opção 1", sub: "Ver perfil", img: "midia/abertura/2.webp", pronta: true },
    { n: 2, nome: "Opção 2", sub: "Em preparação", img: "midia/abertura/4.webp", pronta: false },
    { n: 3, nome: "Opção 3", sub: "Em preparação", img: "midia/abertura/9.webp", pronta: false },
  ];
  // ── peças da logo: x, y, w, h em % da tela do PSD ──
  const P = {
    "0013_Logo-marca": [0, 0, 30.517, 60.837],
    "0012_a": [23.288, 30.237, 9.989, 30.656], "0011_n": [34.097, 29.888, 8.83, 30.432], "0010_g": [43.464, 30.181, 9.998, 45.286],
    "0009_u": [54.398, 30.739, 8.68, 30.139], "0008_a": [63.653, 30.181, 10.036, 30.753], "0007_r": [74.656, 30.167, 5.241, 30.153],
    "0006_d": [79.669, 12.901, 9.848, 47.992], "0005_a": [90.109, 30.237, 9.891, 30.697],
    "0004_TECIDOS": [7.663, 90.516, 18.154, 9.484], "0003_MALHAS": [28.122, 90.516, 15.634, 7.936], "0002_e": [45.911, 90.558, 1.932, 7.88],
    "0001_ESTAMPARIA": [50.114, 90.516, 24.816, 7.936], "0000_DIGITAL": [77.107, 90.516, 15.321, 7.936],
  };
  const LETRAS = ["0012_a", "0011_n", "0010_g", "0009_u", "0008_a", "0007_r", "0006_d", "0005_a"];
  const PALAVRAS = ["0004_TECIDOS", "0003_MALHAS", "0002_e", "0001_ESTAMPARIA", "0000_DIGITAL"];

  let rapida = false;
  try { rapida = sessionStorage.getItem("vg-intro") === "1"; sessionStorage.setItem("vg-intro", "1"); } catch (e) {}
  if (rapida) document.body.classList.add("rapida");

  const logo = document.querySelector(".logo");
  const peca = (nome, cls, i) => {
    const [x, y, w, h] = P[nome];
    const d = document.createElement("div");
    d.className = "p " + cls;
    d.style.cssText = `left:${x}%;top:${y}%;width:${w}%;height:${h}%;--i:${i}`;
    d.innerHTML = `<img src="midia/logo/${nome}.webp" alt="">`;
    logo.appendChild(d);
  };
  peca("0013_Logo-marca", "v", 0);
  LETRAS.forEach((n, i) => peca(n, "letra", i));
  PALAVRAS.forEach((n, i) => peca(n, "pal", i));

  // ── cortina: 9 faixas (5 no celular), metade desce e metade sobe ──
  const cortina = document.querySelector(".cortina");
  for (let i = 0; i < 9; i++) {
    const desce = i % 2 === 0, f = document.createElement("div");
    f.className = "fx";
    f.style.cssText = `--de:${desce ? "-101%" : "101%"};--para:${desce ? "101%" : "-101%"};--s:${desce ? 1 : -1};` +
      `--a:${(Math.abs(i - 4) * 0.09).toFixed(2)}s;--a5:${(Math.abs(i - 2) * 0.09).toFixed(2)}s;--k:${(i * 0.05).toFixed(2)}s`;
    f.innerHTML = `<i style="background-image:url(midia/abertura/${i + 1}.webp)"></i>`;
    cortina.appendChild(f);
  }

  // ── opções ──
  const aviso = document.querySelector(".aviso");
  let tm;
  const avisar = (t) => { aviso.textContent = t; aviso.classList.add("on"); clearTimeout(tm); tm = setTimeout(() => aviso.classList.remove("on"), 2600); };
  const nav = document.querySelector(".opcoes");
  OPCOES.forEach((o, i) => {
    const a = document.createElement("a");
    a.className = "op" + (o.pronta ? "" : " breve");
    a.href = o.pronta ? `opcao-${o.n}/` : "#";
    a.style.setProperty("--i", i);
    a.innerHTML = `<span class="mini"><span style="background-image:url(${o.img})"></span></span><span><small>${o.sub}</small><b>${o.nome}</b></span><span class="seta">→</span>`;
    a.onclick = (e) => {
      e.preventDefault();
      if (!o.pronta) return avisar(`A ${o.nome} está em preparação. Em breve por aqui!`);
      // fecha a cortina e abre o perfil
      cortina.style.display = "flex";
      cortina.className = "cortina cobre";
      setTimeout(() => (location.href = a.href), 750);
    };
    nav.appendChild(a);
  });

  // toque durante a intro = pular para o fim
  addEventListener("pointerdown", (e) => { if (!e.target.closest(".op") && !document.body.classList.contains("rapida")) document.body.classList.add("rapida"); }, { once: true });
  // voltar do perfil pelo botão do navegador (bfcache): abre a cortina de novo
  addEventListener("pageshow", (e) => { if (e.persisted) cortina.style.display = "none"; });
})();
</script>
</body>
</html>
